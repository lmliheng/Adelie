# 持续集成：类型检查、构建、测试三件套。
#
# 与发布工作流分开：这个每次 push / PR 都跑，那个只在打 tag 时跑（见 release.yml）。
# 不配任何 secret：打真实 API 的集成测试在没有 key 时自己跳过，其余用例不依赖网络。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24：core / providers / tools / runtime 的 engines 就写着 >=24
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 启用 pnpm（版本取自 package.json 的 packageManager）
        run: corepack enable

      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

      # 体检补的是上面三件套看不见的那一半：契约与实现有没有分叉、产物里有没有已删源的
      # 残渣、密钥有没有被打出来、issue 草稿是不是写全了（见 docs/audit.md）。
      # --no-gates：三个闸门上面刚跑过，不重复。
      # --fail-on=P2：契约漂移与产物残渣这一档也要挡住，P3 的提醒不挡发布。
      - name: 应用体检（静态部分）
        run: node scripts/audit.mjs --no-gates --fail-on=P2
