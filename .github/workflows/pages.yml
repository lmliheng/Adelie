# 把文档站发布到 GitHub Pages：https://lmliheng.github.io/Adelie/docs/
#
# 这个站点是**仓库自己的** `packages/docs`（React + Vite 的文档站），不是外部站点的快照：
# 2026-10-17 之前这里挂的是上游 PenguinHarness 官网的构建产物（首页、下载页、博客、文档、
# 画廊），那份东西的下载页给的是 `penguin.ooo/install.sh`，跟着装出来的是上游产品。现在只发
# 文档站，工件根上是一个跳转到 `./docs/` 的页面。
#
# 基路径必须是 `/Adelie/docs/`：文档站的路由与资源都按它生成，`SITE_URL` 由它去掉结尾的
# `docs/` 得到（`packages/docs/src/lib/links.ts`），也就是站点根上的那个跳转页。
#
# 首次设置：仓库 Settings → Pages → Source = "GitHub Actions"。
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；跑着的那个不要被取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # BASE_PATH is the docs package's own base-path switch (same variable upstream's site
      # build reads). Without it the shell and every asset URL would be built for "/" and the
      # page would 404 its own bundle one level down.
      - name: Build the docs site
        env:
          BASE_PATH: /Adelie/docs/
        run: pnpm --config.verify-deps-before-run=false --filter @adelie/docs build

      # The artifact is the site root: `pages/` verbatim (the redirect and the 404 page) with
      # the built docs beside it as `docs/`. Nothing else is copied, so a file that is not in
      # `pages/` or produced by the docs build cannot reach the published site.
      - name: Assemble the Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -r pages/. pages-dist/
          cp -r packages/docs/dist pages-dist/docs
          test -f pages-dist/index.html
          test -f pages-dist/docs/index.html
          ls -la pages-dist | head -20

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v4
