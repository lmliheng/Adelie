<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the soft keyboard shrinks the LAYOUT viewport, so the shell's
         `height: 100%` reflows above it instead of the page keeping its full height and
         letting the keyboard cover the bottom (the terminal's last rows, a composer).
         Chrome-only; Safari is covered by useVisualViewportHeight. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/adelie-icon.svg" />
    <title>Adelie</title>
    <!-- Imported themes: the CSS every theme file in <data root>/themes/ becomes (server,
         GET /api/themes.css, no auth so the sign-in page paints the user's own theme too). Served
         empty when nothing is imported, so this link is never a failed request. It is here rather
         than injected after login so the first paint already has it: the sheet only contains
         :root[data-theme="…"] rules, which paint nothing until the attribute says so. -->
    <link rel="stylesheet" href="/api/themes.css" />
    <!-- Pre-paint theme: sets html.dark, data-theme, data-accent and the root font size from the
         stored preferences before the first frame, so a dark or non-default page never flashes
         the light default and the first frame never renders at 16px and reflows. Must equal
         BOOT_SCRIPT in @adelie/ui/boot byte for byte (a test compares them). -->
    <!-- prettier-ignore -->
    <script>(function(){try{var d=document.documentElement,s=localStorage,T=new RegExp("^[a-z][a-z0-9-]{0,31}$"),m=s.getItem("penguin.theme");if(m==="dark"||(m!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))d.classList.add("dark");var t=s.getItem("penguin.themeId");if(typeof t==="string"&&t!=="github"&&T.test(t))d.dataset.theme=t;var a=s.getItem("penguin.accent");if(typeof a==="string"&&a!=="neutral"&&T.test(a))d.dataset.accent=a;var l=s.getItem("penguin.fontLatin");if(["system","mona-sans","ibm-plex-sans","misans"].indexOf(l)>=0)d.dataset.fontLatin=l;var c=s.getItem("penguin.fontCjk");if(["system","noto-sans-sc","misans"].indexOf(c)>=0)d.dataset.fontCjk=c;var z=s.getItem("penguin.textSize"),g=null,o=-1;if(["xs","s","m","l","xl"].indexOf(z)<0){g=s.getItem("penguin.fontScale");o=["sm","md","lg"].indexOf(g);z=o<0?"m":["m","l","xl"][o]}d.style.fontSize={"xs":"14px","s":"15px","m":"16px","l":"18px","xl":"20px"}[z];if(g!==null){try{if(o>=0)s.setItem("penguin.textSize",z);s.removeItem("penguin.fontScale")}catch(e){}}}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
